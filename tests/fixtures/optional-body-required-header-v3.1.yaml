openapi: '3.1.0'
info:
  title: Optional body with required header
  version: 1.0.0
paths:
  /api/v1/entity:
    post:
      operationId: createEntity
      summary: Create an entity
      parameters:
        - name: X-Api-Key
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Created
