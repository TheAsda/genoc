name: CI (min deps)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  YAML_FLOOR: '2.2.2'
  ZOD_FLOOR: '4.0.0'

jobs:
  min-deps:
    name: Min Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # No package-lock.json (bun-only repo); safe since this job overrides dep versions below.
      - run: npm install --no-audit --no-fund

      # npm 10 (bundled with Node 22) crashes on `install --no-save` after
      # `npm install` with "Cannot read properties of null (reading 'edgesOut')"; npm 11 works.
      - run: npx -y npm@11 install --no-save yaml@${{ env.YAML_FLOOR }} zod@${{ env.ZOD_FLOOR }}

      - run: |
          installed="$(node -p "require('./node_modules/yaml/package.json').version + ' ' + require('./node_modules/zod/package.json').version")"
          expected="$YAML_FLOOR $ZOD_FLOOR"
          echo "installed: $installed"
          echo "expected:  $expected"
          [ "$installed" = "$expected" ]

      - run: npm run build

      - run: npm run check

      - run: npm run test
